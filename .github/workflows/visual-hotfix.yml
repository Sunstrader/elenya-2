name: Elenya visual hotfix

on:
  push:
    paths:
      - '.github/workflows/visual-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch visual sources
        run: python3 .github/visual_hotfix.py

      - name: Rebuild browser bundle
        run: npm run build

      - name: Validate visual patch
        run: |
          python3 -c "from pathlib import Path; a=Path('elenya-refonte-52.4/project/21_Assets.js').read_text(); s=Path('elenya-refonte-52.4/project/Scripts_Game.html').read_text(); i=Path('index.html').read_text(); assert 'ELENYA_ENDING_VIDEO_DUPLICATE_IDS_V55' in a; assert \"return 'none';\" in a; assert 'game-v56/backgrounds/' in s; assert 'basalt-ravine-oblique.webp' in s; assert 'uniqueEndingVideoIds' in s; assert 'game-v56/backgrounds/' in i; assert 'uniqueEndingVideoIds' in i; print('Visual hotfix assertions: OK')"
          npm test

      - name: Commit repaired visuals
        run: |
          git config user.name "Elenya Visual Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add elenya-refonte-52.4/project/21_Assets.js elenya-refonte-52.4/project/Scripts_Game.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix V56 gallery and duplicated ending visuals"
          git push origin HEAD:main
