/* V40.3.7 — Achievement baseline
   Les succès déjà acquis sont une méta-progression permanente.
   Ils ne doivent PAS être affichés comme venant d'être débloqués au premier choix
   d'une nouvelle partie. */
function syncKnownAchievementsBaseline(state) {
  let known = [];
  try {
    if (state && Array.isArray(state.achievements)) known = state.achievements;
    else known = getAllAchievements();
  } catch (e) {
    try { known = JSON.parse(localStorage.getItem('elenya_achievements') || '[]'); }
    catch (_) { known = []; }
  }
  _knownAchievements = new Set(Array.isArray(known) ? known : []);
}const PUNCT_PAUSE = { '.': 200, '!': 200, '?': 200, '…': 250, ',': 80, ';': 120, ':': 120 };

function setBackground(url) {
const body = document.body;
if (!url || url === "none" || url === "") {
_currentBg = null;
body.style.setProperty('--bg-before', 'none');
body.style.setProperty('--bg-after', 'none');
body.classList.remove('fading');
return;
}
const safeUrl = ImageCache.getSafeUrl(url);
const cssUrl = "url('" + safeUrl + "')";
if (!_currentBg) {
_currentBg = url;
body.style.setProperty('--bg-before', cssUrl);
body.style.setProperty('--bg-after', 'none');
return;
}
_currentBg = url;
body.style.setProperty('--bg-after', cssUrl);
body.classList.add('fading');
setTimeout(() => {
body.style.setProperty('--bg-before', cssUrl);
body.classList.remove('fading');
body.style.setProperty('--bg-after', 'none');
}, 520);
}

function updateSprite(id, url) {

layer.style.removeProperty('--animated-sprite-sheet');
if (window.Elenya3D) window.Elenya3D.showForSprite(id, url);
if (!url || url === "none" || url === "") {
layer.dataset.current = "";
layer.style.setProperty('--sprite-before', 'none');
layer.style.setProperty('--sprite-after', 'none');
layer.classList.remove('fading');
return;
}
if (layer.dataset.current === url) return;
const safeUrl = ImageCache.getSafeUrl(url);
const cssUrl = "url('" + safeUrl + "')";
if (!layer.dataset.current) {
layer.dataset.current = url;
layer.style.setProperty('--sprite-before', cssUrl);
layer.style.setProperty('--sprite-after', 'none');
return;
}
layer.dataset.current = url;
layer.style.setProperty('--sprite-after', cssUrl);
layer.classList.add('fading');
setTimeout(() => {
layer.style.setProperty('--sprite-before', cssUrl);
layer.classList.remove('fading');
layer.style.setProperty('--sprite-after', 'none');
}, 340);
}

// Le fondu de piste et la baisse pendant la narration restent indépendants.
function setBgmVolume(el, base) {
  el._baseVolume = Math.min(1, Math.max(0, base));
  const factor = typeof RF !== 'undefined' ? RF.audioFactor : 1;
  el.volume = _isMuted ? 0 : el._baseVolume * factor;
}
function playAudioForScene(mood) {
if (CONFIG.VOICE_ENABLED === false) { /* BGM only — voix personnages désactivées pour cette version */ }
const moodKey = mood === 'intimate' ? 'romance' : ((mood === 'end' || mood === 'gameover') ? 'epilogue' : mood);
const bgm = document.getElementById('bgm');
bgm.loop = false;
if (!bgm._rotationBound) {
  bgm._rotationBound = true;
  bgm.addEventListener('ended', () => { const previous = _currentAudioMood; _currentAudioMood = null; _currentAudioUrl = null; if (document.getElementById('accueil-screen').classList.contains('hidden')) playAudioForScene(previous); });
  bgm.addEventListener('playing', () => { if (typeof RF !== 'undefined') RF.noteTrack(bgm.currentSrc || bgm.src); });
}
if (_currentAudioMood === moodKey && _currentAudioUrl) {
  if (!_isMuted && bgm.paused && !bgm._fadeInterval) { setBgmVolume(bgm, CONFIG.BGM_VOLUME); bgm.play().catch(() => {}); }
  return;
}
const tracks = CONFIG.AUDIO_MAP[moodKey] || CONFIG.AUDIO_MAP['exploration'];
const choices = Array.isArray(tracks) ? tracks : [tracks];
const nextIndex = ((_audioRotation[moodKey] ?? -1) + 1) % choices.length;
_audioRotation[moodKey] = nextIndex;
const url = choices[nextIndex];
_currentAudioMood = moodKey;
if (url === _currentAudioUrl) return;
_currentAudioUrl = url;
fadeAudio(bgm, bgm.volume, 0, 400, () => {
bgm.pause();
bgm.src = url;
setBgmVolume(bgm, 0);
if (!_isMuted) bgm.play().then(() => fadeAudio(bgm, 0, CONFIG.BGM_VOLUME, 800, null)).catch(() => {});
});
}

function fadeAudio(el, from, to, durationMs, callback) {
if (el._fadeInterval) clearInterval(el._fadeInterval);
if (el.id === 'bgm') from = el._baseVolume ?? from;
const steps = 20, interval = durationMs / steps, delta = (to - from) / steps;
let step = 0;
el._fadeInterval = setInterval(() => {
step++;
const level = Math.min(1, Math.max(0, from + delta * step));
if (el.id === 'bgm') setBgmVolume(el, level); else el.volume = level;
if (step >= steps) {
clearInterval(el._fadeInterval);
el._fadeInterval = null;
if (callback) callback();
}
}, interval);
}

function toggleMute() {
_isMuted = !_isMuted;
const bgm = document.getElementById('bgm'), btn = document.getElementById('btn-mute');
if (_isMuted) {
fadeAudio(bgm, bgm.volume, 0, 300, () => bgm.pause());
btn.textContent = '🔇';
btn.classList.add('active');
} else {
btn.textContent = '🔊';
btn.classList.remove('active');
if (_currentAudioUrl) bgm.play().then(() => fadeAudio(bgm, 0, CONFIG.BGM_VOLUME, 600, null)).catch(() => {});
}
}

(function initParticles() {
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
const canvas = document.getElementById('particles-canvas'), ctx = canvas.getContext('2d');
let parts = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize, { passive: true });
resize();
for (let i = 0; i < 18; i++) {
parts.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
r: Math.random() * 1.3 + 0.4,
vx: (Math.random() - 0.5) * 0.22,
vy: -Math.random() * 0.32 - 0.08
});
}
function loop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = 'rgba(180,210,255,0.42)';
parts.forEach(p => {
p.x += p.vx; p.y += p.vy;
if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
ctx.beginPath();
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fill();
});
requestAnimationFrame(loop);
}
loop();
})();

(function initFrostTrail() {
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
const canvas = document.getElementById('frost-trail-canvas'), ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize, { passive: true });
resize();
const handleTrail = (x, y) => {
if (document.body.classList.contains('video-playing')) return;
particles.push({ x, y, r: Math.random() * 2 + 1, life: 1 });
if (particles.length > 30) particles.shift();
};
window.addEventListener('mousemove', e => handleTrail(e.clientX, e.clientY), { passive: true });
window.addEventListener('touchmove', e => {
if (e.touches && e.touches.length > 0) handleTrail(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
function loop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (let i = particles.length - 1; i >= 0; i--) {
let p = particles[i];
p.life -= 0.032;
if (p.life <= 0) { particles.splice(i, 1); continue; }
ctx.beginPath();
ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
ctx.fillStyle = `rgba(180,220,255,${0.35 * p.life})`;
ctx.fill();
}
requestAnimationFrame(loop);
}
loop();
})();

function typeWriter(text) {
const el = document.getElementById('narrative');
if (typingRafId) cancelAnimationFrame(typingRafId);
text = normalizeNewlines(text);
el.innerHTML = '';
currentFullText = text;
isTyping = true;
_pauseUntil = 0;
const paras = text.split('\n').filter(p => p.trim().length > 0);
const paraElements = paras.map(() => {
const p = document.createElement('p');
el.appendChild(p);
return p;
});
let paraIdx = 0, charIdx = 0, lastTs = null, carried = 0;
function step(ts) {
if (!isTyping) return;
if (ts < _pauseUntil) { typingRafId = requestAnimationFrame(step); return; }
if (lastTs === null) lastTs = ts;
const delta = (ts - lastTs) + carried;
lastTs = ts;
const toWrite = Math.floor(delta / MS_PER_CHAR);
carried = delta % MS_PER_CHAR;
if (toWrite > 0) {
const currentPara = paras[paraIdx];
const chunk = currentPara.slice(charIdx, charIdx + toWrite);
paraElements[paraIdx].textContent += chunk;
charIdx += toWrite;
const lastChar = chunk.charAt(chunk.length - 1);
if (PUNCT_PAUSE[lastChar] && !(paraIdx === paras.length - 1 && charIdx === currentPara.length)) {
_pauseUntil = ts + PUNCT_PAUSE[lastChar];
carried = 0;
}
if (charIdx >= currentPara.length) { paraIdx++; charIdx = 0; }
}
if (paraIdx < paras.length) {
typingRafId = requestAnimationFrame(step);
} else {
isTyping = false;
typingRafId = null;
focusFirstChoice();
}
}
typingRafId = requestAnimationFrame(step);
}

function updateAAAState(state, data){
  if(!state){ try{state=getActiveState()||{};}catch(e){state={}} }
  const g=state.gauges||{};
  const om=Number(g.lien_O ?? 0), ec=Number(g.lien_E ?? 0), so=Number(g.instabilite ?? 0);
  const caps={ombre:20,eclaireur:20,solo:50};
  [['ombre',om],['eclaireur',ec],['solo',so]].forEach(([k,v])=>{
    const b=document.getElementById('g-'+k),n=document.getElementById('v-'+k);
    if(b)b.style.width=Math.max(0,Math.min(100,(v/caps[k])*100))+'%';
    if(n)n.textContent=Math.round(v);
  });
  let route=String((data&&data.currentRoute)||state.route||'solo').toLowerCase();
  if(route==='eclaireur' || route==='ombre' || route==='poly' || route==='solo'){}
  else if((state.flags||[]).includes('avec_ombre') && (state.flags||[]).includes('avec_eclaireur')) route='poly';
  else if((state.flags||[]).includes('avec_ombre')) route='ombre';
  else if((state.flags||[]).includes('avec_eclaireur')) route='eclaireur';
  else route='solo';
  const labels={solo:['SOI','Aucune chaîne ne te possède.'],ombre:['OMBRE','Le froid répond à ton nom.'],eclaireur:['ÉCLAIREUR','La lumière te suit.'],poly:['POLY','Deux présences, aucune cage.']};
  const [label,sub]=labels[route]||labels.solo;

  document.body.classList.remove('route-solo','route-ombre','route-eclaireur','route-poly'); document.body.classList.add('route-'+route);
}

function importSave(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
try {
const payload = JSON.parse(e.target.result);
const isCompleteBackup = payload && Number(payload.backupVersion) >= 1 && payload.state;
const state = isCompleteBackup ? payload.state : payload;
if (!state || typeof state !== 'object' || Array.isArray(state) || typeof state.currentSceneId !== 'string' || !state.currentSceneId || (state.flags && !Array.isArray(state.flags)) || (state.achievements && !Array.isArray(state.achievements))) throw new Error('État invalide');
if(!state.gameMode) state.gameMode='classic';
if (!['classic','ngplus'].includes(state.gameMode)) throw new Error('Mode invalide');
state.achievements = Array.from(new Set([...getAllAchievements(), ...(state.achievements || [])]));
if (isCompleteBackup) {
  if (Array.isArray(payload.achievements)) {
    state.achievements = Array.from(new Set([...(state.achievements || []), ...payload.achievements]));
    localStorage.setItem('elenya_achievements', JSON.stringify(state.achievements));
  }
  if (Array.isArray(payload.gallery)) localStorage.setItem('ef_gallery', JSON.stringify(Array.from(new Set([...JSON.parse(localStorage.getItem('ef_gallery') || '[]'), ...payload.gallery]))));
  if (Array.isArray(payload.visitedScenes)) {
    _visitedScenes = new Set([..._visitedScenes, ...payload.visitedScenes]);
    localStorage.setItem('ef_visited', JSON.stringify(Array.from(_visitedScenes)));
  }
  if (payload.coverage && typeof RF !== 'undefined') {
    for (const k of ['scenes','edges']) Object.assign(RF.coverage[k], payload.coverage[k] || {});
    if (Array.isArray(payload.coverage.music)) RF.coverage.music = Array.from(new Set([...RF.coverage.music, ...payload.coverage.music]));
    RF.write('ef_coverage_v524', RF.coverage);
  }
}
if (typeof RF !== 'undefined') { RF.cleanup(); RF.resetHistory(); }

// ===== V51 — PROFIL JOUEUR / LECTURE NARRATIVE DES JAUGES =====
function derivePlayerProfile(state) {
  const g = (state && state.gauges) || {};
  const n = (state && state.narrative) || {};
  const seeds = n.endingSeeds || {};
  const possession = Number(g.possession || 0);
  const volonte = Number(g.volonte || 0);
  const memoire = Number(g.memoire_kalthar || 0);
  const instabilite = Number(g.instabilite || 0);

  if (possession >= 20) return { title: 'Couronne possessive', desc: 'Elenya tend à confondre protection, désir et emprise.' };
  if (instabilite >= 30) return { title: 'Givre instable', desc: 'Le pouvoir répond plus vite que la raison.' };
  if (memoire >= 15 && volonte >= 8) return { title: 'Mémoire éveillée', desc: 'Elenya comprend de mieux en mieux ce qui lui a été retiré.' };
  if (volonte >= 10 && possession <= 10) return { title: 'Souveraine libre', desc: 'Elle choisit sans accepter que le choix devienne une cage.' };

  const dominant = Object.entries(seeds).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0))[0];
  if (dominant && Number(dominant[1]||0) > 0) {
    const labels = { shadow:'Ombre', light:'Lumière', poly:'Deux liens', freedom:'Liberté', possession:'Possession', truth:'Vérité', sacrifice:'Sacrifice', reconciliation:'Réconciliation', corona:'Corona' };
    return { title: labels[dominant[0]] || 'En devenir', desc: 'La trajectoire actuelle penche vers : ' + (labels[dominant[0]] || dominant[0]) + '.' };
  }
  return { title: 'En devenir', desc: 'Aucune trajectoire ne domine encore vraiment.' };
}

function describeRelationship(state, route) {
  const n = (state && state.narrative && state.narrative.relationshipStyle) || {};
  const style = route === 'O' ? n.O : n.E;
  const names = route === 'O'
    ? {distance:'distant',tension:'tendu',attachement:'attachement réel',confiance:'confiance profonde',possession:'lien possessif'}
    : {distance:'distant',doute:'doute croissant',devotion:'dévotion',confiance:'confiance profonde',cage:'lien qui devient une cage'};
  return names[style] || 'indéterminé';
}

function recentMeaningfulChoices(state) {
  const hist = Array.isArray(state && state.choiceHistory) ? state.choiceHistory : [];
  return hist.slice(-5).reverse();
}

function formatTime(ms) {
const seconds = Math.floor(ms / 1000);
const minutes = Math.floor(seconds / 60);
const hours = Math.floor(minutes / 60);
if (hours > 0) {
return `${hours}h ${minutes % 60}m`;
} else if (minutes > 0) {
return `${minutes}m ${seconds % 60}s`;
} else {
return `${seconds}s`;
}
}

function updateStats(incrementChoice = false) {
  const state = getActiveState() || {};
  if (!state.stats) state.stats = {};
  if (!state.stats.playTime) state.stats.playTime = 0;
  if (!state.stats.choicesMade) state.stats.choicesMade = 0;
  if (state.sessionStartedAt) {
    state.stats.playTime += Math.max(0, Date.now() - Number(state.sessionStartedAt));
    state.sessionStartedAt = Date.now();
  }
  if (incrementChoice) state.stats.choicesMade++;
  const ombre = Number(state.gauges?.lien_O || 0);
  const eclaireur = Number(state.gauges?.lien_E || 0);
  const solo = Number(state.gauges?.instabilite || 0);
  if (ombre > eclaireur && ombre > solo) state.stats.dominantPath = 'Ombre';
  else if (eclaireur > ombre && eclaireur > solo) state.stats.dominantPath = 'Éclaireur';
  else state.stats.dominantPath = 'Soi';
  setActiveState(state);
  updateAAAState(state);
  return state;
}

  if (result && result.updatedState) {
    setActiveState(result.updatedState);

// de la scène suivante jusqu'à un retour menu > Reprendre.
const nextData = result.nextSceneData;
if (result.updatedState) {
  setActiveState(result.updatedState);
  updateAAAState(result.updatedState, nextData);
  if (result.choiceUX) ux513ChoiceAftermath(result.choiceUX);
  if (result.updatedState.achievements) persistAchievements(result.updatedState.achievements);
  checkNewAchievements(result.updatedState);
}
if (nextData.image) {
ImageCache.preloadImage(nextData.image);
unlockCG(nextData.image);
document.body.style.setProperty('--bg-before', "url('" + ImageCache.getSafeUrl(nextData.image) + "')");
_currentBg = nextData.image;
}
if (nextData.transitionGif) unlockCG(nextData.transitionGif);
const sid = String(nextData.sceneNumber || '');
const isFb = isFlashbackScene(nextData);
const lightTransition = /^(LIEN_|JOUTE_|R_|ACTE_DAGUE|ACTE3_DAGUE|ACTE3_SILAS|ACTE1_SOLO|ACTE_SOLO|AVEU_)/.test(sid)
&& !isFb;

// V50.1.0 — TRANSITION ATOMIQUE : le serveur est la source de vérité.
// On rend TOUJOURS la scène reçue immédiatement. Les effets visuels deviennent
// purement décoratifs et ne peuvent plus bloquer le passage à la scène suivante.
renderScene(nextData);
if (typeof RF !== 'undefined' && nextData.presentation?.effect) RF.effect(nextData.presentation.effect);

if (isFb) {
  playFlashbackEffect(() => {});
} else if (!lightTransition) {
  playIceCrack(oldBg, () => {});
}
})
.withFailureHandler(err => {
if (typeof RF !== 'undefined' && epoch !== RF.epoch) return;
if (_retryCount < 2) {
_retryCount++;
setTimeout(callServer, 1500);
} else {
hideOverlay();
if (typeof RF !== 'undefined') RF.settle(false);
document.querySelectorAll('#choices .choice-btn').forEach(b=>b.disabled=false);
alert('Erreur serveur : ' + err);
}
})
.serverProcessChoice(currentState, _lastChoiceKey);
}

document.addEventListener('keydown', e => {
if (e.key === 'Escape') {
closeHistory();
hideAchievements();
hideStats();
hideGallery();
hideNotes();
hideSaveModal();
return;
}
const shortcutTarget = e.target;
if (shortcutTarget && (shortcutTarget.matches('input, textarea, select') || shortcutTarget.isContentEditable)) {
return;
}
if (e.ctrlKey || e.altKey || e.metaKey || document.querySelector('[id$="-modal"].show,#gallery-lightbox.show,#history-drawer.open') || !document.getElementById('accueil-screen').classList.contains('hidden')) return;
if (e.key === ' ' || e.code === 'Space') {
if (shortcutTarget.closest('button,a')) return;
e.preventDefault();
if (document.body.classList.contains('video-playing')) { stopAmbientMedia(); return; }
if (isTyping) { skipTypeWriter(); return; }
// Espace révèle le texte, mais ne choisit jamais une réponse à la place du joueur.
return;
}
if (e.key === 'h' || e.key === 'H') { toggleHistory(); return; }
const btns = document.querySelectorAll('.choice-btn:not(:disabled)');
const idx = parseInt(e.key, 10) - 1;
if (!isNaN(idx) && idx >= 0 && btns[idx]) btns[idx].click();
});

// ===== V51.3 — SEMANTIC NARRATIVE AUDIT =====
const UX512 = {
  feedbackTimer: null,
  majorHistoryLimit: 12,
  showFeedback(text) {
    if (!text) return;
    const el = document.getElementById('narrative-feedback');
    if (!el) return;
    el.textContent = text;
    el.classList.add('visible');
    clearTimeout(this.feedbackTimer);

    // V51.5.0 — temps de lecture adaptatif.
    // Minimum ~4.8 s ; +35 ms par caractère ; maximum 9 s.
    // Les feedbacks narratifs ne disparaissent plus avant d'avoir pu être lus.
    const readingMs = Math.max(4800, Math.min(9000, 2600 + String(text).length * 35));
    this.feedbackTimer = setTimeout(() => el.classList.remove('visible'), readingMs);
  },
  deriveProfile(state) {
    const g = (state && state.gauges) || {};
    const f = new Set((state && state.flags) || []);
    const P=+g.possession||0,V=+g.volonte||0,I=+g.instabilite||0,M=+g.memoire_kalthar||0;
    let title="En devenir", subtitle="Ta mémoire revient. Tes choix n’ont pas encore dessiné une couronne définitive.";
    if (P>=20 || f.has('domination_path_chosen')) {
      title="La Couronne qui serre"; subtitle="Le pouvoir répond vite. La question est de savoir ce qu’il te laissera encore aimer.";
    } else if (V>=12 && P<=7) {
      title="La Reine sans chaînes"; subtitle="Tu avances sans confondre l’amour, le devoir et la possession.";
    } else if (I>=30) {
      title="La Tempête éveillée"; subtitle="Le givre te reconnaît plus vite que le monde. Rester toi-même devient un choix.";
    } else if (M>=15 && V>=9) {
      title="La Mémoire souveraine"; subtitle="Tu te souviens davantage, mais l’ancienne Elenya n’a plus tous les droits sur la nouvelle.";
    }
    const rel=[];
    if (f.has('lisiere_romance_O_ouverte') || f.has('interet_romantique_O') || f.has('romance_reelle_O')) rel.push("Kaelen : désir reconnu");
    else if ((+g.lien_O||0)>=5) rel.push("Kaelen : proximité");
    if (f.has('lisiere_romance_E_ouverte') || f.has('interet_romantique_E') || f.has('romance_reelle_E')) rel.push("Alistair : désir reconnu");
    else if ((+g.lien_E||0)>=5) rel.push("Alistair : proximité");
    if (f.has('voie_solo_profonde')) rel.push("Voie Solo : affirmée");
    return {title,subtitle,relations:rel};
  },
  addJournal(text, meta) {
    if (!text) return;
    const s = (typeof getActiveState === 'function' ? getActiveState() : null);
    if (!s) return;
    s.narrative = s.narrative || {};
    s.narrative.uxJournal = Array.isArray(s.narrative.uxJournal) ? s.narrative.uxJournal : [];
    if (!s.narrative.uxJournal.some(e => e.text === text)) {
      s.narrative.uxJournal.push({text, meta: meta || ('Acte ' + (s.chapter || '—'))});
      s.narrative.uxJournal = s.narrative.uxJournal.slice(-24);
      if (typeof setActiveState === 'function') setActiveState(s);
    }
  },
  renderJournal(container) {
    if (!container) return;
    const s = typeof getActiveState === 'function' ? getActiveState() : null;
    const entries = s?.narrative?.uxJournal || [];
    container.innerHTML = entries.length
      ? '<div class="ux-journal">' + entries.map(e =>
          '<div class="ux-journal-entry"><div class="ux-journal-meta">'+escapeHtml512(e.meta||'Souvenir')+'</div><div>'+escapeHtml512(e.text)+'</div></div>'
        ).join('') + '</div>'
      : '<div class="ux-journal"><em>Aucun souvenir majeur consigné pour l’instant.</em></div>';
  },
  endingSummary(state) {
    const p=this.deriveProfile(state||{});
    const f=new Set(state?.flags||[]);
    const g=state?.gauges||{};
    const companions=[];
    companions.push('Kaelen — ' + (f.has('kaelen_mort')?'mort':f.has('kaelen_perdu_definitif')?'perdu':f.has('kaelen_absous')?'pardonné':'destin encore nuancé'));
    companions.push('Alistair — ' + (f.has('alistair_mort')?'mort':f.has('alistair_perdu_definitif')?'perdu':f.has('alistair_redime')?'rédimé':'destin encore nuancé'));
    return {profile:p, companions};
  }
};
function escapeHtml512(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function ux512ChoiceAftermath(choice){
  // Conservé pour compatibilité : les retours sont consultables dans le journal.
  return;
}


// ===== V51.3 — SEMANTIC NARRATIVE AUDIT / UX =====
function ux513ChoiceAftermath(meta){
  // Aucun popup automatique : évite les messages d'affinité répétés ou décalés.
  // Les conséquences restent appliquées et mémorisées côté serveur.
  return;
}
function ux513ProfileCard(state){
  const p=UX512.deriveProfile(state||{});
  const relations=(p.relations||[]).map(x=>'<li>'+escapeHtml512(x)+'</li>').join('');
  return '<div class="ux-profile-card" aria-label="Profil narratif d’Elenya">'+
    '<div class="ux-profile-title">'+escapeHtml512(p.title)+'</div>'+
    '<div class="ux-profile-subtitle">'+escapeHtml512(p.subtitle)+'</div>'+
    (relations?'<ul>'+relations+'</ul>':'')+'</div>';
}
function ux513RefreshSemanticJournal(){
  const list=document.getElementById('history-list');
  if(!list) return;
  // Keep ordinary scene history, then append/update a semantic memory section.
  const old=document.getElementById('ux-semantic-journal');
  if(old) old.remove();
  const state=getActiveState()||{};
  const entries=state?.narrative?.uxJournal||[];
  if(!entries.length) return;
  const wrap=document.createElement('div');
  wrap.id='ux-semantic-journal';
  wrap.className='ux-journal';
  wrap.innerHTML='<div class="ux-profile-title">Mémoire de tes choix</div>'+
    entries.slice(-12).map(e=>'<div class="ux-journal-entry"><div class="ux-journal-meta">'+
      escapeHtml512((e.importance||'souvenir')+(e.target?' · '+e.target:''))+
      '</div><div>'+escapeHtml512(e.text||'')+'</div></div>').join('');
  list.appendChild(wrap);
}
function ux513RenderEndingSummary(container){
  const state=getActiveState()||{};
  if(!state.currentSceneId || !/^FIN_|^GAME_OVER/.test(String(state.currentSceneId))) return;
  const summary=UX512.endingSummary(state);
  const major=state?.narrative?.majorChoices||[];
  const card=document.createElement('div');
  card.className='ux-ending-summary';
  card.setAttribute('aria-label','Récapitulatif de cette fin');
  card.innerHTML='<h3>Ce qui t’a menée ici</h3>'+
    '<div class="ux-profile-title">'+escapeHtml512(summary.profile.title)+'</div>'+
    '<div class="ux-profile-subtitle">'+escapeHtml512(summary.profile.subtitle)+'</div>'+
    '<ul>'+summary.companions.map(x=>'<li>'+escapeHtml512(x)+'</li>').join('')+
    major.slice(-5).map(x=>'<li>'+escapeHtml512(x.text||x.choice||'')+'</li>').join('')+'</ul>';
  container.appendChild(card);
}


// V51.5.0 — contrôle manuel du feedback.
(function(){
  const bindFeedbackControls = () => {
    const el = document.getElementById('narrative-feedback');
    if (!el || el.dataset.v5141Bound) return;
    el.dataset.v5141Bound = '1';

    // Clic/tap = fermer volontairement.
    el.addEventListener('click', () => {
      clearTimeout(UX512.feedbackTimer);
      el.classList.remove('visible');
    });

    // Sur ordinateur, garder le texte tant que la souris est dessus.
    el.addEventListener('mouseenter', () => clearTimeout(UX512.feedbackTimer));
    el.addEventListener('mouseleave', () => {
      if (!el.classList.contains('visible')) return;
      UX512.feedbackTimer = setTimeout(() => el.classList.remove('visible'), 2500);
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindFeedbackControls, {once:true});
  } else {
    bindFeedbackControls();
  }
})();
