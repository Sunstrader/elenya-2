<script>
'use strict';
Object.assign(ACHIEVEMENTS_REGISTRY,{
  ach_archive_sans_chaines:{icon:'📜',title:'Une mémoire sans chaînes',desc:'Dans le Cycle Brisé, conserver les clauses sans exposer les victimes.'},
  ach_amitie_choisie:{icon:'❄',title:'La place d’un ami',desc:'Choisir explicitement l’amitié et voir cette limite respectée.'}
});
const RF = (() => {
  const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
  const read=(k, fallback)=>{try{const raw=localStorage.getItem(k);return raw===null?fallback:JSON.parse(raw)}catch(_){return fallback}};
  const tell=t=>{$('rf-live').textContent=t};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){tell('Stockage local indisponible ou plein : exporte une sauvegarde.');return false}};
  const defaults={music:.35,ambience:.1,effects:.16,voice:1,narrator:false,voiceURI:"",voiceStyle:"fantasy",voiceDuck:"reduce",rate:.95,contrast:false,motion:!matchMedia('(prefers-reduced-motion: reduce)').matches,vibration:false,auto:false};
  const OFFICIAL_VOICES = [
    { id: 'Charon', name: 'Charon', desc: 'Grave, calme & posé (homme)' },
    { id: 'Fenrir', name: 'Fenrir', desc: 'Profond, captivant & expressif (homme)' },
    { id: 'Zephyr', name: 'Zephyr', desc: 'Doux, posé & aérien (neutre)' },
    { id: 'Kore', name: 'Kore', desc: 'Féminine, claire & résolue (femme)' },

    { id: 'Despina', name: 'Despina', desc: 'Claire, vive & alerte (femme)' },
    { id: 'Erinome', name: 'Erinome', desc: 'Douce, feutrée & veloutée (femme)' },
    { id: 'Lapetus', name: 'Lapetus', desc: 'Profond, contemplatif & antique (homme)' },
    { id: 'Laomedeia', name: 'Laomedeia', desc: 'Sereine, fluide & mystérieuse (femme)' },
    { id: 'Leda', name: 'Leda', desc: 'Élégante, noble & posée (femme)' },
    { id: 'Orus', name: 'Orus', desc: 'Ferme, robuste & rassurant (homme)' },
    { id: 'Pulcherrima', name: 'Pulcherrima', desc: 'Brillante, expressive & lumineuse (femme)' },
    { id: 'Rasalgethi', name: 'Rasalgethi', desc: 'Vénérable, sage & résonnant (homme)' },
    { id: 'Sadachbia', name: 'Sadachbia', desc: 'Secret, méditatif & discret (homme)' },
    { id: 'Sadaltager', name: 'Sadaltager', desc: 'Tranquille & équilibré (homme)' },
    { id: 'Schedar', name: 'Schedar', desc: 'Ferme, digne & noble (femme/neutre)' },
    { id: 'Umbriel', name: 'Umbriel', desc: 'Sombre, murmuré & envoûtant (homme)' },
    { id: 'Vindemiatrix', name: 'Vindemiatrix', desc: 'Distinguée, précise & sobre (femme)' },
    { id: 'Zubenelgenubi', name: 'Zubenelgenubi', desc: 'Antique, solennel & lointain (homme)' },
    { id: 'Achird', name: 'Achird', desc: 'Direct, amical & discret (homme)' },
    { id: 'Algieba', name: 'Algieba', desc: 'Majestueuse & rayonnante (femme)' },
    { id: 'Alnilam', name: 'Alnilam', desc: 'Clair, stellaire & limpide (homme)' },
    { id: 'Autonoe', name: 'Autonoe', desc: 'Vivante, expressive & curieuse (femme)' }
  ];
  const legacyPrefs=read('ef_preferences_v524',{}),prefs={...defaults,...legacyPrefs};
  const legacyDefaults={music:.7,ambience:.18,effects:.3,voice:.8};
  Object.keys(legacyDefaults).forEach(k=>{if(Number(legacyPrefs[k])===legacyDefaults[k])prefs[k]=defaults[k]});
  let data=null,busy=false,requestEpoch=0,pending=null,voiceEpoch=0,currentUtterance=null,autoTimer=null,modalFocus=null,explorer=null,audioContext=null,ambientNode=null,ambientGain=null,ambientFilter=null,ambienceKind=null,galleryPlayer=null,toolsOpen=false,narratorDucking=false,duckLevel=1,duckTimer=null,effectsBus=null;
  let history={entries:[],index:-1},historyMode='classic';
  const coverage=read('ef_coverage_v524',{scenes:{},edges:{},music:[]});
  coverage.scenes=coverage.scenes||{};coverage.edges=coverage.edges||{};coverage.music=Array.isArray(coverage.music)?coverage.music:[];
  function active(){return getActiveState()||{}}
  function mode(){return active().gameMode==='ngplus'?'ngplus':'classic'}
  function key(){return 'ef_rollback_v524_'+historyMode}
  function fingerprint(s){return JSON.stringify([s.currentSceneId,s.gameMode,s.flags,s.gauges,s.choiceHistory,s.inventory,s.narrative]);}
  function saveHistory(){
    while(history.entries.length>24 || (history.entries.length>1 && JSON.stringify(history).length>700000)){history.entries.shift();history.index--;}
    history.index=Math.max(-1,history.index);write(key(),history);buttons();
  }
  function resetHistory(){history={entries:[],index:-1};historyMode=mode();write(key(),history);buttons();}
  function restoreHistory(){historyMode=mode();const stored=read(key(),{entries:[],index:-1});history=Array.isArray(stored.entries)&&Number.isInteger(stored.index)?stored:{entries:[],index:-1};const entry=history.entries[history.index];if(entry&&fingerprint(entry.state)!==fingerprint(active()))history={entries:[],index:-1};buttons();}
  function buttons(){const locked=!!active().noRollback;if($('rf-back'))$('rf-back').disabled=busy||locked||history.index<=0;if($('rf-forward'))$('rf-forward').disabled=busy||locked||history.index>=history.entries.length-1;}
  function checkpoint(){if(!data)return;const s=clone(active()),d=clone(data);delete d.renderedState;
    if(pending){history.entries=history.entries.slice(0,history.index+1);pending=null;}
    const last=history.entries[history.index];if(!last||fingerprint(last.state)!==fingerprint(s)){history.entries.push({state:s,scene:d});history.index=history.entries.length-1;}else last.scene=d;
    saveHistory();
  }
  function rollback(delta){if(busy||active().noRollback)return;const index=history.index+delta,entry=history.entries[index];if(!entry)return;
    stopVoice();clearTimeout(autoTimer);requestEpoch++;stopAmbientMedia(false);
    const restored=clone(entry.state);restored.achievements=Array.from(new Set([...getAllAchievements(),...(restored.achievements||[])]));
    // Méta-progression permanente conservée ; tout l’état de cette partie revient au point choisi.
    restored.sessionStartedAt=Date.now();history.index=index;setActiveState(restored);data=clone(entry.scene);
    originalRender(data);present();saveHistory();tell('Point précédent restauré : '+data.title);autoSave();
  }
  function prepareChoice(){if(busy)return false;stopVoice();clearTimeout(autoTimer);stopAmbientMedia(false);checkpoint();pending=clone(active());busy=true;buttons();
    write('elenya_'+mode()+'_before_choice',{state:clone(active()),timestamp:Date.now(),sceneName:data&&data.title});return true;
  }
  function settle(success){busy=false;if(!success)pending=null;buttons();}
  function scene(next){
    data=clone(next);if(historyMode!==mode())restoreHistory();
    if(next.renderedState)setActiveState(next.renderedState);
    coverage.scenes[(next.gameMode||mode())+':'+(next.sceneId||next.sceneNumber)]=true;
    const h=active().choiceHistory||[],last=h[h.length-1];if(last)coverage.edges[mode()+':'+last.scene+':'+last.choice]=true;
    write('ef_coverage_v524',coverage);checkpoint();present();
  }
  function present(){
    $('rf-tools').hidden=!toolsOpen||!$('accueil-screen').classList.contains('hidden');buttons();
    document.body.classList.add('game-live');
    document.body.classList.toggle('rf-ground-frost',!!data?.presentation?.groundFrozen);
    document.body.classList.toggle('rf-ice-aftermath',!!data?.presentation?.iceStormAftermath);
    document.querySelectorAll('.header,.body-content,.footer').forEach(el=>el.inert=false);
    const label=$('rf-ground-label');label.hidden=!data?.presentation?.groundFrozen;label.textContent='Le givre que tu as créé recouvre encore le sol.';
    const frozen=data?.presentation?.frozenCharacter;['left','right','center'].forEach(side=>{const layer=$('sprite-'+side),url=layer.dataset.current||'';layer.classList.toggle('rf-frozen',!!frozen&&(frozen==='both'||url.toLowerCase().includes(frozen.toLowerCase())));});
    setAmbience(data?.presentation?.ambience||'quiet');
    if(prefs.narrator&&!document.body.classList.contains('video-playing'))speak();
    scheduleAuto();
  }
  function syncAudioMix(){
    const bgm=$('bgm');
    if(bgm)bgm.volume=_isMuted?0:(bgm._baseVolume??prefs.music)*duckLevel;
    if(ambientGain){ambientGain.gain.cancelScheduledValues(audioContext.currentTime);ambientGain.gain.setTargetAtTime(_isMuted?0:prefs.ambience*.12*duckLevel,audioContext.currentTime,.04);}
    if(effectsBus)effectsBus.gain.setTargetAtTime(_isMuted?0:prefs.effects*duckLevel,audioContext.currentTime,.04);
    if(galleryPlayer)galleryPlayer.volume=_isMuted?0:prefs.music*duckLevel;
  }
  function getDuckTarget(active){
    if(!active) return 1;
    if(prefs.voiceDuck==='mute') return 0;
    if(prefs.voiceDuck==='keep') return 1;
    return .25;
  }
  function duckOtherAudio(active){
    if(active===narratorDucking)return;
    narratorDucking=active;clearInterval(duckTimer);
    const from=duckLevel,target=getDuckTarget(active),steps=10;let step=0;
    duckTimer=setInterval(()=>{duckLevel=from+(target-from)*(++step/steps);syncAudioMix();if(step>=steps){clearInterval(duckTimer);duckTimer=null;}},active?20:50);
  }
  let voicePlayer=null;
  function getVoicePlayer(){if(!voicePlayer&&typeof Audio!=='undefined'){voicePlayer=new Audio();voicePlayer.id='rf-voice-player';}return voicePlayer;}
  function updateNarrateUI(speaking){
    const btn=$('btn-rf-narrate');
    if(btn){btn.textContent=speaking?'⏹️ Arrêter':'🎙️ Narration';btn.classList.toggle('active',speaking);btn.setAttribute('aria-pressed',speaking?'true':'false');}
    const readBtn=$('rf-read');if(readBtn)readBtn.disabled=speaking;
  }
  function frenchVoices(){
    if(!('speechSynthesis' in window))return [];
    const score=v=>(/natural|neural|online|premium|enhanced/i.test(v.name)?100:0)+(/^fr[-_]FR$/i.test(v.lang)?20:0);
    return window.speechSynthesis.getVoices().filter(v=>/^fr(?:-|_|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name,'fr'));
  }
  function refreshVoiceChoices(){
    const select=$('rf-voice-select');if(!select)return;
    const voices=frenchVoices();
    let html='<option value="">Automatique — français</option>';
    html+='<optgroup label="Voix naturelles (30 voix officielles)">';
    OFFICIAL_VOICES.forEach(v=>{
      html+='<option value="'+escapeHtml(v.id)+'">'+escapeHtml(v.name)+' — '+escapeHtml(v.desc)+'</option>';
    });
    html+='</optgroup>';
    if(voices.length>0){
      html+='<optgroup label="Voix du système local (synthèse navigateur)">';
      voices.forEach(v=>{
        html+='<option value="'+escapeHtml(v.voiceURI)+'">'+escapeHtml(v.name)+' ('+escapeHtml(v.lang)+')</option>';
      });
      html+='</optgroup>';
    }
    select.innerHTML=html;
    select.value=prefs.voiceURI||'';
    updateVoiceLabel();
  }
  function updateVoiceLabel(){
    const el=$('rf-voice-active-label');if(!el)return;
    const cur=prefs.voiceURI;
    if(!cur){el.textContent='Voix active : Automatique (meilleure voix française disponible)';return;}
    const off=OFFICIAL_VOICES.find(v=>v.id===cur);
    if(off){el.textContent='Voix active : '+off.name+' — '+off.desc;return;}
    const sys=frenchVoices().find(v=>v.voiceURI===cur);
    if(sys){el.textContent='Voix active : '+sys.name+' ('+sys.lang+')';return;}
    el.textContent='Voix active : '+cur;
  }
  if('speechSynthesis' in window)window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoiceChoices);
  function stopVoice(){
    voiceEpoch++;currentUtterance=null;
    if(voicePlayer){try{voicePlayer.pause();voicePlayer.currentTime=0;voicePlayer.src='';}catch(_){}}

    if('speechSynthesis' in window)window.speechSynthesis.cancel();
    updateNarrateUI(false);
  }
  function toggleSpeak(){
    if(currentUtterance||(voicePlayer&&!voicePlayer.paused&&voicePlayer.currentTime>0)){
      stopVoice();tell('Lecture arrêtée.');
    }else{
      speak();
    }
  }
  function speak(){
    stopVoice();if(!data||!$('accueil-screen').classList.contains('hidden'))return;
    if(document.body.classList.contains('video-playing')){tell('Ferme la cinématique pour écouter la scène.');return;}
    skipTypeWriter();const token=voiceEpoch;
    const text=[data.title,data.narrative,...(data.choices||[]).map((c,i)=>'Choix '+(i+1)+'. '+c.text)].join('\n').replace(/\*+/g,'');

    const isOfficial=OFFICIAL_VOICES.some(v=>v.id===prefs.voiceURI);
    const canFetch=typeof fetch==='function'&&typeof window!=='undefined'&&window.location&&!window._isTestEnv;

    if(isOfficial&&canFetch){
      updateNarrateUI(true);
      tell('Génération de la voix naturelle ('+prefs.voiceURI+')…');
      fetch('/api/tts',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:text,voice:prefs.voiceURI,style:prefs.voiceStyle||'fantasy',rate:prefs.rate||.95})
      }).then(r=>{if(!r.ok)throw new Error('TTS HTTP '+r.status);return r.json();})
      .then(res=>{
        if(token!==voiceEpoch)return;
        if(res&&res.audioUrl){
          const p=getVoicePlayer();
          if(!p){fallbackSpeech(text,token);return;}
          p.src=res.audioUrl;p.playbackRate=prefs.rate||1;p.volume=_isMuted?0:(prefs.voice??1);
          p.onplay=()=>{if(token===voiceEpoch)duckOtherAudio(true);};
          p.onended=()=>{if(token!==voiceEpoch)return;duckOtherAudio(false);updateNarrateUI(false);tell('Lecture terminée. À toi de choisir.');};
          p.onerror=()=>{if(token!==voiceEpoch)return;duckOtherAudio(false);fallbackSpeech(text,token);};
          p.play().catch(()=>{if(token===voiceEpoch)fallbackSpeech(text,token);});
        }else{fallbackSpeech(text,token);}
      }).catch(()=>{
        if(token!==voiceEpoch)return;
        fallbackSpeech(text,token);
      });
      return;
    }
    fallbackSpeech(text,token);
  }
  function fallbackSpeech(text,token){
    if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){updateNarrateUI(false);tell('Lecture vocale indisponible dans ce navigateur. Le texte reste accessible.');return;}
    updateNarrateUI(true);
    const fragments=(text.match(/[^.!?\n]+[.!?]?/g)||[text]).flatMap(s=>s.match(/.{1,220}(?:\s|$)|.{1,220}/g)||[]).map(x=>x.trim()).filter(Boolean);
    const pieces=[];for(const fragment of fragments){const last=pieces.length-1;if(last>=0&&pieces[last].length+fragment.length<220)pieces[last]+=' '+fragment;else pieces.push(fragment);}
    const fr=frenchVoices();const selected=fr.find(v=>v.voiceURI===prefs.voiceURI)||fr[0];

      const utterance=new SpeechSynthesisUtterance(pieces[index++]);currentUtterance=utterance;utterance.lang=selected?.lang||'fr-FR';utterance.rate=prefs.rate;utterance.volume=_isMuted?0:prefs.voice;if(selected)utterance.voice=selected;
